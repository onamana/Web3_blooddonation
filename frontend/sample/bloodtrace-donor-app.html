<meta charset="utf-8">

<title>BloodTrace — 아트보드 1 · 헌혈자 앱 (390×844)</title>
<style>
  :root{

    --rbc:#B3202C; --pls:#B45309; --plt:#6D28D9;

  *{box-sizing:border-box}
  body{margin:0;background:#F5F5F4;color:var(--ink);-webkit-font-smoothing:antialiased;
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  button{font:inherit;color:inherit}
  a{color:var(--pri);text-decoration:none} a:hover{color:var(--pri-d);text-decoration:underline}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  .wrap{padding:56px 48px;width:max-content}
  .h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .hrow{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
  .hmeta{font-size:13px;color:var(--mute)}
  .frames{display:flex;align-items:flex-start;gap:32px}
  .col{display:flex;flex-direction:column;gap:10px}
  .lbl{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.04em}
  .phone{position:relative;width:390px;background:var(--bg);border:1px solid var(--line);border-radius:20px;
    overflow:hidden;box-shadow:0 1px 3px rgba(28,25,23,.05)}
  .phone.fixed{height:844px;display:flex;flex-direction:column}
  .foot{font-size:11.5px;color:var(--mute)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;white-space:nowrap;border-radius:999px;padding:3px 8px}
  .b-ok{color:var(--done);background:var(--done-bg);border:1px solid var(--done-line)}
  .b-fail{color:var(--fail);background:var(--fail-bg);border:1px solid var(--fail-line)}
  .b-stored{color:var(--stored);background:var(--stored-bg);border:1px solid var(--stored-line)}
  .b-disc{color:var(--mute);background:#F5F5F4;border:1px solid var(--line)}
  .stack{display:flex;flex-direction:column}
  .sec{padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
  .t2{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:14px;display:flex;flex-direction:column;gap:6px}
  .kpi-l{font-size:11.5px;color:var(--mute)}
  .kpi-v{font-size:26px;font-weight:600;letter-spacing:-.02em}
  .hist{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;
    background:var(--card);border:1px solid var(--line)}
  .hist.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-tint)}
  .node{width:100%;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
  .node.bad{border:1px dashed var(--fail)}
  .nbox{display:flex;flex-direction:column;gap:8px;padding:12px;margin-bottom:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
  .nbox.bad{border:1px dashed var(--fail)}
  .tag{font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 7px;color:#fff}
  .meta{font-size:11.5px;color:var(--mute);margin-top:2px}
  .hash{font-size:11px;color:var(--sub);background:#F5F5F4;border:1px solid var(--line);border-radius:6px;padding:2px 6px;cursor:pointer}
  .btn{width:100%;cursor:pointer;border-radius:10px;padding:15px;font-size:15px;font-weight:600;border:1px solid var(--pri);background:var(--pri);color:#fff}
  .btn.off{border-color:var(--line);background:var(--card);color:var(--mute)}
  .tbtn{flex:none;display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:11.5px;font-weight:600;
    border-radius:8px;padding:7px 9px;border:1px solid var(--line);background:var(--card);color:var(--mute)}
  .tbtn.on{border-color:var(--fail);background:var(--fail-bg);color:var(--fail)}

  .addr{font-size:11px;font-weight:600;border-radius:999px;padding:4px 8px;border:1px solid var(--line);background:var(--card);color:var(--mute)}
  .addr.on{background:#F5F5F4;color:var(--ink)}
  .did{font-size:11px;font-weight:600;color:var(--pri);background:var(--pri-tint);border:1px solid var(--pri-line);border-radius:999px;padding:4px 8px}
  .scrim{position:absolute;inset:0;background:rgba(28,25,23,.35);z-index:20}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:#fff;border-top:1px solid var(--line);
    border-radius:16px 16px 20px 20px;padding:14px 18px 20px;display:flex;flex-direction:column;gap:14px;
    animation:sheetUp .22s ease both;box-shadow:0 -8px 24px rgba(28,25,23,.08)}
  .row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
  .chipf{font-size:11.5px;color:var(--sub);background:#F5F5F4;border:1px solid var(--line);border-radius:999px;padding:4px 9px}
  .notice{font-size:11.5px;line-height:1.5;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-wrap:pretty}
  .toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);
    font-size:12px;border-radius:999px;padding:8px 14px;animation:fade .18s ease both}
  .banner{display:flex;gap:10px;align-items:flex-start;background:var(--fail-bg);border:1px solid var(--fail-line);
    border-radius:12px;padding:12px 14px;animation:fade .2s ease both}
  .legend{display:flex;gap:12px;flex-wrap:wrap;padding-top:14px;margin-top:4px;border-top:1px solid #F5F5F4}
  .lg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mute)}
  .dot{width:8px;height:8px;border-radius:999px}
  .xbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;color:var(--sub);cursor:pointer}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
</style>
</head>

      '<div style="margin-top:16px;display:flex;align-items:center;gap:10px;background:var(--done-bg);border:1px solid var(--done-line);border-radius:12px;padding:14px 16px;animation:fade .25s ease both">' +
        '<span style="color:var(--done);display:flex">' + IC.shield + '</span>' +
        '<div style="display:flex;flex-direction:column;gap:2px">' +
          '<div style="font-size:13px;font-weight:600;color:var(--done)">지갑이 연결되었습니다</div>' +
          '<div class="mono" style="font-size:12px;color:var(--sub)">' + WALLET.addr + ' · ' + WALLET.donorId + '</div>' +

}

/* ───────────────────────── A-2 ~ A-5 렌더 ───────────────────────── */
function renderF2(){
  const d = sel();
  return '' +
  '<div class="appbar">' +
    '<div style="display:flex;align-items:center;gap:8px">' +
      '<span style="color:var(--pri);display:flex">' + IC.drop + '</span>' +

    '<div style="display:flex;gap:6px">' +
      '<span class="addr mono' + (S.connected ? ' on' : '') + '">' + (S.connected ? WALLET.addr : '지갑 미연결') + '</span>' +
      (S.connected ? '<span class="did mono">' + WALLET.donorId + '</span>' : '') +
    '</div>' +
  '</div>' +

  /* A-2 */
  '<div class="sec" style="padding-top:20px">' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between">' +

    '<div class="grid2">' +
      '<div class="card kpi"><div class="kpi-l">총 헌혈 횟수</div>' +
        '<div style="display:flex;align-items:baseline;gap:4px"><span class="kpi-v mono">' + SUMMARY.count + '</span><span style="font-size:13px;color:var(--sub)">회</span></div>' +
        '<div class="kpi-l mono">누적 ' + SUMMARY.volume + '</div></div>' +
      '<div class="card kpi"><div class="kpi-l">마지막 헌혈</div>' +
        '<div class="mono" style="font-size:17px;font-weight:600;letter-spacing:-.01em">' + SUMMARY.lastDate + '</div>' +
        '<div style="display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--mute)">' + IC.pin + '<span>' + SUMMARY.lastPlace + '</span></div></div>' +
      '<div class="card kpi"><div class="kpi-l">다음 헌혈 가능일</div>' +
        '<div class="kpi-v mono" style="color:var(--pri)">' + SUMMARY.nextDday + '</div>' +
        '<div style="align-self:flex-start;font-size:10.5px;font-weight:600;color:var(--plt);background:#F5F3FF;border:1px solid #E4DBFF;border-radius:999px;padding:3px 7px">AI 안내</div></div>' +

          '<span class="kpi-l">도움받은 추정 환자</span>' +
          '<button data-act="tip" style="width:15px;height:15px;border-radius:999px;border:1px solid #D6D3D1;background:#fff;color:var(--mute);font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">i</button></div>' +
        '<div style="display:flex;align-items:baseline;gap:4px"><span class="kpi-v mono">' + SUMMARY.patients + '</span><span style="font-size:13px;color:var(--sub)">명</span></div>' +
        (S.patientTip ? '<div style="font-size:11px;line-height:1.5;background:#F5F5F4;border:1px solid var(--line);border-radius:8px;padding:8px;text-wrap:pretty">' + SUMMARY.patientTip + '</div>' : '') +
      '</div>' +
    '</div>' +
  '</div>' +

  /* A-3 */
  '<div class="sec"><div class="t2">헌혈 이력</div>' +
    DONATIONS.map(x => {
      const on = x.id === d.id;
      const bad = on && S.tampered;
      return '<button class="hist' + (on ? ' on' : '') + '" data-act="pick" data-id="' + x.id + '">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
          '<span class="mono" style="font-size:13px;font-weight:600">' + x.id + '</span>' +
          '<span class="badge ' + (bad ? 'b-fail' : 'b-ok') + '">' + (bad ? '검증 실패 1건' : '검증됨') + '</span></div>' +
        '<div class="mono" style="display:flex;gap:10px;font-size:12px;color:var(--sub)"><span>' + x.date + '</span><span>·</span><span>' + x.volume + 'mL</span></div>' +
        '<div style="font-size:12px;color:var(--mute)">' + x.place + '</div>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px dashed var(--line)">' +
          '<span style="font-size:12px">' + x.stage + '</span>' +
          '<span style="font-size:11.5px;color:var(--pri);font-weight:600">' + (on ? '여정 보기 ↓' : '탭하여 여정 보기') + '</span></div>' +
      '</button>';
    }).join('') +
  '</div>' +

  /* A-4 */
  '<div class="sec">' +
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">' +
      '<div style="display:flex;flex-direction:column;gap:3px"><div class="t2">혈액 여정</div>' +
      '<div class="mono" style="font-size:12px;color:var(--mute)">' + d.id + ' · ' + d.volume + 'mL · ' + d.date + '</div></div>' +
      '<button class="tbtn' + (S.tampered ? ' on' : '') + '" data-act="tamper">' + IC.alert + '<span>위변조 시뮬레이션</span></button>' +
    '</div>' +
    (S.tampered ?
      '<div class="banner"><span style="color:var(--fail);display:flex;margin-top:1px">' + IC.alertL + '</span>' +
        '<div style="display:flex;flex-direction:column;gap:3px">' +
        '<div style="font-size:13px;font-weight:700;color:var(--fail)">기록 검증 실패 1건</div>' +
        '<div style="font-size:12px;line-height:1.5;color:#7C2D12;text-wrap:pretty">혈장 성분의 공급 기록 해시가 원장과 일치하지 않습니다. 해당 노드는 검증 실패로 표시됩니다.</div>' +
      '</div></div>' : '') +
    '<div class="card" style="padding:16px 14px;display:flex;flex-direction:column">' +
      /* 루트 */
      '<div style="display:flex;gap:12px;align-items:flex-start">' +
        '<div style="display:flex;flex-direction:column;align-items:center;align-self:stretch">' +
          '<div style="width:10px;height:10px;border-radius:999px;background:var(--pri);margin-top:5px"></div>' +
          '<div style="flex:1;width:1px;background:#D6D3D1;min-height:22px"></div></div>' +
        '<div style="flex:1;padding-bottom:18px"><div style="font-size:14px;font-weight:600">채혈 완료</div>' +
          '<div class="meta mono">' + d.root.time + ' · ' + d.root.org + '</div></div>' +
      '</div>' +
      /* 검사 */
      '<div style="display:flex;gap:12px;align-items:flex-start">' +
        '<div style="display:flex;flex-direction:column;align-items:center;align-self:stretch">' +
          '<div style="width:10px;height:10px;border-radius:999px;background:var(--pri);margin-top:5px"></div>' +
          '<div style="flex:1;width:1px;background:#D6D3D1;min-height:16px"></div></div>' +
        '<button data-act="open" data-key="test" style="flex:1;text-align:left;background:transparent;border:0;padding:0 0 14px;cursor:pointer">' +
          '<div style="display:flex;align-items:center;gap:6px"><span style="font-size:14px;font-weight:600">검사 완료</span>' +
            '<span class="badge b-ok">검증됨</span></div>' +
          '<div class="meta mono">' + d.test.time + ' · ' + d.test.org + '</div>' +
          '<div class="mono" style="font-size:11px;color:var(--mute);margin-top:4px">' + d.test.hash + '</div>' +
        '</button>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:8px;padding:0 0 12px 22px">' +
        '<span style="font-size:11px;font-weight:600;color:var(--mute)">' + d.branches.length + '개 성분으로 분기</span>' +
        '<span style="flex:1;height:1px;background:var(--line)"></span></div>' +
      /* 분기 */
      d.branches.map((b, bi) => {
        const last = bi === d.branches.length - 1;
        const anyBad = b.steps.some(s => isBad(b, s));
        return '<div style="position:relative;padding-left:26px">' +
          '<div style="position:absolute;left:4px;top:0;width:1px;background:#D6D3D1;height:' + (last ? '22px' : '100%') + '"></div>' +
          '<div style="position:absolute;left:4px;top:22px;width:18px;height:1px;background:#D6D3D1"></div>' +
          '<div style="position:absolute;left:0;top:18px;width:9px;height:9px;border-radius:999px;background:' + b.color + '"></div>' +
          '<div class="nbox' + (anyBad ? ' bad' : '') + '">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
              '<div style="display:flex;align-items:center;gap:6px">' +
                '<span class="tag" style="background:' + b.color + '">' + b.comp + '</span>' +
                '<span class="mono" style="font-size:12px;font-weight:600">' + b.code + '</span></div>' +
              '<span class="badge ' + b.statusClass + '">' + b.status + '</span></div>' +
            b.steps.map((s, si) => {
              const bad = isBad(b, s);
              return '<button class="node' + (bad ? ' bad' : '') + '" data-act="open" data-key="b' + bi + '-' + si + '">' +
                '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
                  '<span style="font-size:13px;font-weight:600">' + s.name + '</span>' +
                  '<span class="badge ' + (bad ? 'b-fail' : 'b-ok') + '">' + (bad ? '검증 실패' : '검증됨') + '</span></div>' +
                '<div class="meta mono">' + s.time + ' · ' + s.org + '</div>' +
                '<div style="display:flex;align-items:center;gap:6px;margin-top:6px">' +
                  '<span style="color:var(--mute);display:flex">' + IC.sealS + '</span>' +
                  '<span class="hash mono" data-act="copy" data-hash="' + s.hash + '">' + s.hash + '</span>' +
                  '<span style="display:flex;color:var(--mute)">' + IC.copy + '</span></div>' +
                (s.note ? '<div style="font-size:11.5px;color:var(--mute);margin-top:6px">' + s.note + '</div>' : '') +
              '</button>';
            }).join('') +
          '</div></div>';
      }).join('') +
      '<div class="legend">' +
        '<div class="lg"><span class="dot" style="background:' + COLOR.rbc + '"></span>적혈구</div>' +
        '<div class="lg"><span class="dot" style="background:' + COLOR.pls + '"></span>혈장</div>' +
        '<div class="lg"><span class="dot" style="background:' + COLOR.plt + '"></span>혈소판</div>' +
      '</div>' +
    '</div>' +
    '<div style="font-size:11.5px;line-height:1.5;color:var(--mute);text-wrap:pretty">한 번의 헌혈은 여러 성분으로 나뉘어 각각 다른 경로로 사용됩니다. 노드를 탭하면 기록된 필드를 볼 수 있습니다.</div>' +
  '</div>' +

  /* A-5 */
  '<div class="sec" style="padding-bottom:24px">' +
    '<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:6px">' +
      '<div style="display:flex;align-items:center;gap:7px"><span style="color:var(--pri);display:flex">' + IC.pin + '</span>' +
        '<span style="font-size:14px;font-weight:600">내 혈액이 사용된 지역: ' + SUMMARY.region + '</span></div>' +
      '<div style="font-size:11.5px;line-height:1.5;color:var(--mute);text-wrap:pretty">환자 정보와 병원별 사용 내역은 공개되지 않습니다. 지역 단위까지만 확인할 수 있습니다.</div>' +
    '</div>' +
    '<div class="mono" style="font-size:11px;color:var(--mute);text-align:center">모든 수치는 가상 데모 데이터입니다.</div>' +
  '</div>' +

  renderSheet() +
  (S.copied ? '<div class="toast">해시가 복사되었습니다</div>' : '');
}

function stepByKey(key){
  const d = sel();
  if (key === 'root') return { s:d.root, ok:true };
  if (key === 'test') return { s:d.test, ok:true };
  const m = /^b(\d+)-(\d+)$/.exec(key);
  if (!m) return null;
  const b = d.branches[+m[1]]; if (!b) return null;
  const s = b.steps[+m[2]];    if (!s) return null;
  return { s:s, ok:!isBad(b, s) };
}

function renderSheet(){
  if (!S.sheetKey) return '';
  const hit = stepByKey(S.sheetKey);
  if (!hit) return '';
  const s = hit.s;
  return '<div class="scrim" data-act="close"></div>' +
  '<div class="sheet">' +
    '<div style="width:38px;height:4px;border-radius:999px;background:var(--line);align-self:center"></div>' +
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">' +
      '<div style="display:flex;flex-direction:column;gap:4px">' +
        '<div style="font-size:16px;font-weight:700;letter-spacing:-.01em">' + s.name + '</div>' +
        '<div class="mono" style="font-size:11.5px;color:var(--mute)">' + s.time + '</div></div>' +
      '<button class="xbtn" data-act="close">닫기</button></div>' +
    '<div style="display:flex;flex-direction:column;gap:8px">' +
      '<div class="row"><span style="color:var(--mute)">서명 기관</span><span style="font-weight:600">' + s.org + '</span></div>' +
      '<div class="row"><span style="color:var(--mute)">블록 높이</span><span class="mono" style="font-weight:600">' + s.block + '</span></div>' +
      '<div class="row"><span style="color:var(--mute)">트랜잭션</span>' +
        '<span class="mono" data-act="copy" data-hash="' + s.hash + '" style="font-weight:600;cursor:pointer;text-decoration:underline dotted">' + s.hash + '</span></div>' +
      '<div class="row"><span style="color:var(--mute)">검증 상태</span>' +
        '<span class="badge ' + (hit.ok ? 'b-ok' : 'b-fail') + '">' + (hit.ok ? '검증됨' : '검증 실패') + '</span></div>' +
    '</div>' +
    '<div style="display:flex;flex-direction:column;gap:8px">' +
      '<div style="font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:.03em">기록된 필드</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px">' + (s.fields||[]).map(f => '<span class="chipf">' + f + '</span>').join('') + '</div>' +
    '</div>' +
    '<div class="notice">이 기록에는 환자·헌혈자 신원 정보가 포함되지 않습니다.</div>' +
  '</div>';
}

/* ───────────────────────── 상호작용 ───────────────────────── */
let toastTimer = null;
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'copy'){
    e.stopPropagation();
    try { navigator.clipboard.writeText(t.dataset.hash); } catch(err){}
    S.copied = true; render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ S.copied = false; render(); }, 1400);
    return;
  }
  if (act === 'wallet') S.connected = !S.connected;
  if (act === 'tip')    S.patientTip = !S.patientTip;
  if (act === 'pick'){  S.selId = t.dataset.id; S.sheetKey = null; }
  if (act === 'tamper'){ S.tampered = !S.tampered; S.sheetKey = null; }
  if (act === 'open')   S.sheetKey = t.dataset.key;
  if (act === 'close')  S.sheetKey = null;
  render();
});

function render(){
  document.getElementById('f1').innerHTML = renderF1();
  document.getElementById('f2').innerHTML = renderF2();
}
render();
</script>
