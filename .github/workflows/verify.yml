name: Verify prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            contract/package-lock.json
            backend/package-lock.json
            did/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix contract
      - run: npm ci --prefix backend
      - run: npm ci --prefix did
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix contract
      - run: node --test contract/scripts/runtime-bytecode.test.js
      - run: npm run test:security --prefix backend
      - run: node --test scripts/setup-did-env.test.cjs
      - run: npm test --prefix did
      - run: npm run test:integration --prefix backend
      - run: npm run test:did --prefix backend
      - run: node scripts/demo-local.mjs --check
