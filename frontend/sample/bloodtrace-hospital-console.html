<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BloodTrace — 아트보드 2 · 병원 매칭 (1440×900)</title>
<style>
  :root{
    --ink:#1C1917; --mute:#78716C; --sub:#57534E; --line:#E7E5E4; --bg:#FAFAF9; --card:#FFFFFF;
    --pri:#B3202C; --pri-d:#8E1922; --pri-tint:#FDF2F3;
    --done:#15803D; --done-bg:#F0FDF4; --done-line:#BBF7D0;
    --stored:#1D4ED8; --fail:#C2410C; --fail-bg:#FFF7ED; --fail-line:#FED7AA;
    --rbc:#B3202C; --pls:#B45309; --plt:#6D28D9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#F5F5F4;color:var(--ink);-webkit-font-smoothing:antialiased;
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  button{font:inherit;color:inherit}
  a{color:var(--pri);text-decoration:none} a:hover{color:var(--pri-d);text-decoration:underline}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  .wrap{padding:56px 48px;width:max-content}
  .hrow{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
  .h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .hmeta{font-size:13px;color:var(--mute)}
  .screen{position:relative;width:1440px;height:900px;background:var(--bg);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(28,25,23,.05);display:flex;flex-direction:column}
  .topbar{height:60px;flex:none;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .body{flex:1;display:flex;min-height:0}
  .side{width:300px;flex:none;border-right:1px solid var(--line);background:#fff;padding:22px 20px;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
  .main{flex:1;min-width:0;overflow-y:auto;padding:22px 24px 28px;display:flex;flex-direction:column;gap:18px}
  .fl{font-size:12px;font-weight:600;color:var(--sub)}
  .fg{display:flex;flex-direction:column;gap:10px}
  .t2{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;white-space:nowrap;border-radius:999px;padding:3px 8px}
  .b-ok{color:var(--done);background:var(--done-bg);border:1px solid var(--done-line)}
  .b-fail{color:var(--fail);background:var(--fail-bg);border:1px solid var(--fail-line)}
  .chip{cursor:pointer;font-size:12.5px;font-weight:600;border-radius:8px;padding:7px 11px;background:#fff;color:var(--sub);border:1px solid var(--line)}
  .chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  .comp{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;font-size:12.5px;font-weight:600;
    text-align:left;border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink);border:1px solid var(--line)}
  .comp.on{background:var(--pri-tint);border-color:var(--pri)}
  .step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
  .sbtn{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:16px;color:var(--sub);cursor:pointer;line-height:1}
  select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;background:#fff;color:var(--ink);cursor:pointer;font-family:inherit}
  .seg{display:flex;background:#F5F5F4;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;cursor:pointer;font-size:12.5px;font-weight:600;border-radius:7px;padding:8px 0;border:0;background:transparent;color:var(--mute)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(28,25,23,.08)}
  .seg button.on.urgent{background:var(--fail);color:#fff;box-shadow:none}
  .primary{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer}
  .primary:hover{background:var(--pri-d)}
  .hint{font-size:11px;color:var(--mute)}
  .sorts{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .sorts button{cursor:pointer;font-size:12px;font-weight:600;border-radius:7px;padding:7px 11px;border:0;background:transparent;color:var(--mute)}
  .sorts button.on{background:var(--ink);color:var(--bg)}
  .tip{align-self:flex-end;max-width:340px;font-size:11.5px;line-height:1.5;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;box-shadow:0 2px 6px rgba(28,25,23,.06);text-wrap:pretty}
  .ins{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .ins.open{border-color:#D6D3D1;box-shadow:0 2px 8px rgba(28,25,23,.06)}
  .ins-head{text-align:left;background:transparent;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:8px;width:100%}
  .ins-sum{font-size:13.5px;line-height:1.55;font-weight:600;text-wrap:pretty}
  .ins-basis{font-size:11px;line-height:1.5;color:var(--mute);text-wrap:pretty}
  .exp{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px;animation:fade .2s ease both}
  .res{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
  .res.sent{border-color:var(--done-line)}
  .col{display:flex;flex-direction:column}
  .divider{border-left:1px solid #F5F5F4;padding-left:20px}
  .reqbtn{cursor:pointer;border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:600;border:1px solid var(--pri);background:var(--pri);color:#fff}
  .reqbtn.sent{border-color:var(--done-line);background:var(--done-bg);color:var(--done)}
  .wtip{position:absolute;top:66px;left:-8px;z-index:8;width:186px;background:var(--ink);color:var(--bg);border-radius:10px;
    padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 12px rgba(28,25,23,.18)}
  .modal-scrim{position:absolute;inset:0;z-index:40;background:rgba(28,25,23,.4);display:flex;align-items:center;justify-content:center;padding:40px}
  .modal{width:620px;max-height:100%;overflow-y:auto;background:#fff;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;
    animation:fade .2s ease both;box-shadow:0 12px 40px rgba(28,25,23,.2)}
  .xbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;color:var(--sub);cursor:pointer}
  .notice{font-size:11.5px;line-height:1.5;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-wrap:pretty}
  .foot{font-size:11px;color:var(--mute);text-align:center;padding-top:4px}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hrow">
    <div class="h1">아트보드 2 — 병원 매칭</div>

/* 이력 보기 모달 — 헌혈자 화면(A-4)과 동일한 원장 조각 */

const S = { abo:'O', rh:'Rh+', comps:['혈소판'], units:4, region:'대전권', urgency:'긴급',

const svg = (p, sz) => '<svg width="' + (sz||16) + '" height="' + (sz||16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';

/* ───────────────────────── 스파크라인 ───────────────────────── */
function sparkline(ins){
  const all = ins.actual.concat(ins.forecast), W = 300, H = 96, MIN = 30, MAX = 90;
  const pts = all.map((v,i) => [Math.round(i * (W/(all.length-1))), Math.round((H - ((v-MIN)/(MAX-MIN))*H)*10)/10]);
  const aPts = pts.slice(0, ins.actual.length);
  const fPts = pts.slice(ins.actual.length - 1);
  const band = fPts.map(p => p[0] + ',' + Math.max(2, p[1]-11)).join(' ') + ' ' +
               fPts.slice().reverse().map(p => p[0] + ',' + Math.min(H-2, p[1]+11)).join(' ');
  return '<div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px">' +
    '<svg width="100%" height="96" viewBox="0 0 300 96" preserveAspectRatio="none">' +
      '<polygon points="' + band + '" fill="#EDE9FE"></polygon>' +
      '<polyline points="' + aPts.map(p=>p.join(',')).join(' ') + '" fill="none" stroke="var(--ink)" stroke-width="1.6"></polyline>' +
      '<polyline points="' + fPts.map(p=>p.join(',')).join(' ') + '" fill="none" stroke="' + COLOR.plt + '" stroke-width="1.6" stroke-dasharray="4 3"></polyline>' +
    '</svg>' +
    '<div style="display:flex;gap:12px;margin-top:6px">' +
      '<span style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--mute)"><span style="width:12px;height:2px;background:var(--ink)"></span>실제 수요 8주</span>' +
      '<span style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--mute)"><span style="width:12px;height:2px;background:' + COLOR.plt + '"></span>예측</span>' +
      '<span style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--mute)"><span style="width:12px;height:8px;background:#EDE9FE"></span>신뢰구간 80%</span>' +
    '</div></div>';
}

/* ───────────────────────── 렌더 ───────────────────────── */
function renderSide(){

      '<button class="sbtn" data-act="inc">+</button></div></div>' +

  '<div class="fg"><div class="fl">지역</div>' +
    '<select data-act="region">' + FILTERS.regions.map(r => '<option' + (S.region===r?' selected':'') + '>' + r + '</option>').join('') + '</select></div>' +

  '<div class="fg"><div class="fl">긴급도</div>' +
    '<div class="seg">' + FILTERS.urgency.map(u =>
      '<button class="' + (S.urgency===u?'on':'') + (u==='응급'?' urgent':'') + '" data-act="urg" data-val="' + u + '">' + u + '</button>').join('') + '</div>' +
    (S.urgency==='응급' ? '<div style="font-size:11.5px;line-height:1.5;color:var(--fail);background:var(--fail-bg);border:1px solid var(--fail-line);border-radius:10px;padding:9px 10px;text-wrap:pretty">응급: 이송 60분 이내 기관만 우선 표시하고 유효기간 여유 조건을 완화합니다.</div>' : '') +
  '</div>' +

  '<button class="primary" data-act="search" style="margin-top:auto">혈액 찾기</button>' +
  '<div class="hint" style="text-align:center">' + (S.searched
    ? '조건 적용: ' + S.abo + ' ' + S.rh + ' · ' + (S.comps.join(', ') || '성분 미선택') + ' · ' + S.units + '유닛 · ' + S.region + ' · ' + S.urgency
    : '조건 선택 후 [혈액 찾기]를 누르면 결과가 갱신됩니다.') + '</div>';
}

function renderInsight(ins){
  const open = S.openInsight === ins.id;
  let exp = '';
  if (open && ins.id === 'demand'){
    exp = sparkline(ins) + '<div style="display:flex;flex-direction:column;gap:5px">' +
      ins.reasons.map(r => '<div style="display:flex;gap:7px;font-size:11.5px;line-height:1.5;color:var(--sub)"><span style="color:' + COLOR.plt + '">·</span><span>' + r + '</span></div>').join('') + '</div>';
  }
  if (open && ins.id === 'waste'){
    exp = '<div style="border:1px solid var(--line);border-radius:10px;overflow:hidden">' +
        '<div style="display:grid;grid-template-columns:1.5fr .9fr .7fr;gap:6px;padding:7px 10px;background:var(--bg);font-size:10.5px;font-weight:600;color:var(--mute)">' +
          '<span>기관</span><span>성분</span><span>D-day</span></div>' +
        ins.rows.map(r => '<div style="display:grid;grid-template-columns:1.5fr .9fr .7fr;gap:6px;padding:7px 10px;border-top:1px solid #F5F5F4;font-size:11.5px">' +
          '<span>' + r.org + '</span><span style="color:' + r.color + ';font-weight:600">' + r.comp + '</span>' +
          '<span class="mono" style="color:var(--fail)">' + r.dday + '</span></div>').join('') +
      '</div>' +
      '<div style="display:flex;gap:8px;align-items:flex-start;background:var(--done-bg);border:1px solid var(--done-line);border-radius:10px;padding:9px 10px">' +
        '<span style="color:var(--done);display:flex;margin-top:1px">' + IC.check + '</span>' +
        '<span style="font-size:11.5px;line-height:1.5;color:#166534;text-wrap:pretty">' + ins.transfer + '</span></div>';
  }
  if (open && ins.id === 'route'){
    exp = '<div style="display:flex;flex-direction:column;gap:8px">' +
      ins.nodes.map(n => {
        const ok = n.state === 'ok';
        return '<div style="display:flex;gap:9px;align-items:flex-start">' +
          '<div style="display:flex;flex-direction:column;align-items:center;align-self:stretch">' +
            '<span style="width:9px;height:9px;border-radius:999px;flex:none;background:' + (ok?'var(--done)':(n.state==='missing'?'#fff':'var(--fail)')) + (n.state==='missing'?';border:1px dashed var(--fail)':'') + '"></span>' +
            '<span style="flex:1;width:1px;background:var(--line);min-height:8px"></span></div>' +
          '<div style="flex:1;border-radius:8px;padding:8px 10px;background:' + (ok?'var(--bg)':'var(--fail-bg)') + ';border:' + (ok?'1px solid var(--line)':'1px dashed var(--fail)') + '">' +
            '<div style="font-size:11.5px;font-weight:600;color:' + (ok?'var(--ink)':'var(--fail)') + '">' + n.name + '</div>' +
            '<div class="mono" style="font-size:10.5px;color:var(--mute);margin-top:2px">' + n.meta + '</div></div>' +
        '</div>';
      }).join('') +
      '<div style="font-size:11.5px;line-height:1.5;color:var(--fail);text-wrap:pretty">' + ins.note + '</div></div>';
  }
  return '<div class="ins' + (open?' open':'') + '">' +
    '<button class="ins-head" data-act="ins" data-id="' + ins.id + '">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
        '<span style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700">' +
          '<span style="width:8px;height:8px;border-radius:999px;background:' + ins.color + '"></span>' + ins.title + '</span>' +
        '<span class="hint">' + (open?'접기 −':'자세히 +') + '</span></div>' +
      '<div class="ins-sum">' + ins.summary + '</div>' +
      '<div class="ins-basis">' + ins.basis + '</div>' +
    '</button>' +
    (open ? '<div class="exp">' + exp + '</div>' : '') +
  '</div>';
}

function sortedResults(){
  const arr = RESULTS.slice();
  if (S.sort === '거리순') return arr.sort((a,b) => a.distance - b.distance);
  if (S.sort === '유효기간 임박순') return arr.sort((a,b) => a.expiryDays - b.expiryDays);
  return arr.sort((a,b) => b.score - a.score);
}

function renderResult(r){
  const sent = S.requested.indexOf(r.id) >= 0;
  const near = r.expiryDays <= 5;
  const dash = Math.round(163.4 * r.score / 100);
  const scoreColor = r.score >= 85 ? 'var(--done)' : r.score >= 70 ? 'var(--pri)' : 'var(--mute)';
  return '<div class="res' + (sent?' sent':'') + '"><div style="display:flex;align-items:stretch;gap:20px">' +
    '<div class="col" style="width:280px;flex:none;gap:7px">' +
      '<div style="display:flex;align-items:center;gap:7px">' +
        '<span style="font-size:15px;font-weight:700;letter-spacing:-.01em">' + r.org + '</span>' +
        '<span style="font-size:10.5px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 7px">' + r.kind + '</span></div>' +
      '<div style="display:flex;gap:14px;font-size:12.5px;color:var(--sub)">' +
        '<span style="display:flex;align-items:center;gap:5px">' + IC.pin + '<span class="mono">' + r.distance + 'km</span></span>' +
        '<span style="display:flex;align-items:center;gap:5px">' + IC.clock + '<span class="mono">예상 이송 ' + r.eta + '분</span></span></div>' +
      '<div style="display:flex;align-items:center;gap:8px;margin-top:2px">' +
        '<span class="badge ' + (r.verified?'b-ok':'b-fail') + '">' + (r.verified?'이력 검증됨':'이력 검증 실패') + '</span>' +
        '<button data-act="modal" data-id="' + r.id + '" style="background:transparent;border:0;padding:0;font-size:12px;font-weight:600;color:var(--pri);cursor:pointer;text-decoration:underline">이력 보기</button></div>' +
    '</div>' +
    '<div class="col divider" style="flex:1;min-width:0;gap:9px">' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
        '<span style="font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;color:#fff;background:' + compColor(r.comp) + '">' + r.comp + '</span>' +
        '<span class="mono" style="font-size:11.5px;font-weight:600;background:#F5F5F4;border:1px solid var(--line);border-radius:999px;padding:3px 9px">' + r.blood + '</span></div>' +
      '<div style="display:flex;gap:24px">' +
        '<div class="col" style="gap:2px"><span class="hint">보유 유닛</span>' +
          '<span class="mono" style="font-size:19px;font-weight:600">' + r.units + '</span></div>' +
        '<div class="col" style="gap:2px"><span class="hint">유효기간</span>' +
          '<span class="mono" style="font-size:19px;font-weight:600;color:' + (near?'var(--fail)':'var(--ink)') + '">D-' + r.expiryDays + '</span></div></div>' +
    '</div>' +
    '<div class="divider" style="width:250px;flex:none;display:flex;gap:14px;align-items:flex-start">' +
      '<div data-act="score" data-id="' + r.id + '" style="position:relative;flex:none">' +
        '<svg width="62" height="62" viewBox="0 0 62 62">' +
          '<circle cx="31" cy="31" r="26" fill="none" stroke="#F5F5F4" stroke-width="6"></circle>' +
          '<circle cx="31" cy="31" r="26" fill="none" stroke="' + scoreColor + '" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + dash + ' 400" transform="rotate(-90 31 31)"></circle></svg>' +
        '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">' +
          '<span class="mono" style="font-size:19px;font-weight:600;line-height:1">' + r.score + '</span>' +
          '<span style="font-size:9px;color:var(--mute)">매칭</span></div>' +
        (S.hoverId === r.id ? '<div class="wtip"><div style="font-size:10.5px;color:#D6D3D1;letter-spacing:.03em">가중치 분해</div>' +
          r.weights.map(w => '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px">' +
            '<span>' + w[0] + '</span><span class="mono">' + w[1] + '</span></div>').join('') + '</div>' : '') +
      '</div>' +
      '<div class="col" style="flex:1;min-width:0;gap:7px">' +
        '<div style="font-size:11.5px;line-height:1.5;color:var(--sub);text-wrap:pretty">' + r.reason + '</div>' +
        '<div style="background:var(--done-bg);border:1px solid var(--done-line);border-radius:8px;padding:6px 8px">' +
          '<span style="font-size:11px;font-weight:600;line-height:1.45;color:#166534;text-wrap:pretty">' + r.recover + '</span></div>' +
        '<button class="reqbtn' + (sent?' sent':'') + '" data-act="req" data-id="' + r.id + '">' + (sent?'요청 전송됨':'요청 보내기') + '</button>' +
      '</div>' +
    '</div>' +
  '</div></div>';
}

function renderModal(){
  if (!S.modalId) return '';
  const r = RESULTS.find(x => x.id === S.modalId); if (!r) return '';
  const t = timelineFor(r);
  return '<div class="modal-scrim" data-act="closeModal"><div class="modal" data-act="stop">' +
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">' +
      '<div class="col" style="gap:4px"><div style="font-size:17px;font-weight:700;letter-spacing:-.01em">이력 검증 — ' + t.org + '</div>' +
        '<div class="mono" style="font-size:12px;color:var(--mute)">' + t.donation + ' · 헌혈자 신원 정보 미포함</div></div>' +
      '<button class="xbtn" data-act="closeModal">닫기</button></div>' +
    '<div class="col">' + t.nodes.map(n =>
      '<div style="display:flex;gap:12px;align-items:flex-start">' +
        '<div style="display:flex;flex-direction:column;align-items:center;align-self:stretch;padding-top:4px">' +
          '<span style="width:10px;height:10px;border-radius:999px;flex:none;background:' + (n.ok?'var(--pri)':'#fff') + (n.ok?'':';border:1px dashed var(--fail)') + '"></span>' +
          '<span style="flex:1;width:1px;background:var(--line);min-height:14px"></span></div>' +
        '<div style="flex:1;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:' + (n.ok?'var(--bg)':'var(--fail-bg)') + ';border:' + (n.ok?'1px solid var(--line)':'1px dashed var(--fail)') + '">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">' +
            '<span style="font-size:13.5px;font-weight:600;color:' + (n.ok?'var(--ink)':'var(--fail)') + '">' + n.name + '</span>' +
            '<span class="badge ' + (n.ok?'b-ok':'b-fail') + '">' + (n.ok?'검증됨':'검증 실패') + '</span></div>' +
          '<div class="mono" style="font-size:11.5px;color:var(--mute);margin-top:3px">' + n.meta + '</div></div>' +
      '</div>').join('') + '</div>' +
    '<div class="notice">헌혈자 화면과 동일한 원장 기록을 기관 관점으로 표시합니다. 환자·헌혈자 신원 정보는 포함되지 않습니다.</div>' +
  '</div></div>';
}

function render(){
  document.getElementById('screen').innerHTML =
  '<div class="topbar">' +
    '<div style="display:flex;align-items:center;gap:10px">' +
      '<span style="color:var(--pri);display:flex">' + IC.drop + '</span>' +
      '<span style="font-size:16px;font-weight:700;letter-spacing:-.01em">BloodTrace</span>' +
      '<span style="font-size:12px;color:var(--mute);border-left:1px solid var(--line);padding-left:10px;margin-left:2px">혈액 매칭 콘솔</span></div>' +
    '<div style="display:flex;align-items:center;gap:14px">' +
      '<span class="mono" style="font-size:12px;color:var(--mute)">원장 동기화 ' + LEDGER_SYNC + '</span>' +
      '<span class="badge b-ok" style="font-size:12px;padding:5px 10px">노드 4/4 정상</span></div>' +
  '</div>' +
  '<div class="body">' +
    '<div class="side">' + renderSide() + '</div>' +
    '<div class="main">' +
      '<div class="col" style="gap:10px">' +
        '<div style="display:flex;align-items:center;gap:8px"><span class="t2">AI 인사이트</span>' +
          '<span style="font-size:11px;font-weight:600;color:' + COLOR.plt + ';background:#F5F3FF;border:1px solid #E4DBFF;border-radius:999px;padding:3px 8px">예측 모델 v0.4 · 데모</span></div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start">' +
          INSIGHTS.map(renderInsight).join('') + '</div>' +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
        '<div style="display:flex;align-items:baseline;gap:8px"><span class="t2">매칭 결과</span>' +
          '<span style="font-size:12px;color:var(--mute)">' + (S.searched ? S.region + ' · ' + S.abo + ' ' + S.rh + ' · ' : '') + RESULTS.length + '개 기관</span></div>' +
        '<div class="sorts">' + FILTERS.sorts.map(x =>
          '<button class="' + (S.sort===x?'on':'') + '" data-act="sort" data-val="' + x + '">' + x + '</button>').join('') + '</div>' +
      '</div>' +
      (S.sortTip ? '<div class="tip">' + FILTERS.sortTip + '</div>' : '') +
      '<div class="col" style="gap:12px">' + sortedResults().map(renderResult).join('') + '</div>' +
      '<div class="mono foot">모든 수치는 가상 데모 데이터입니다. 실명·환자 정보·진료 기록은 포함되지 않습니다.</div>' +
    '</div>' +
  '</div>' + renderModal();
}

/* ───────────────────────── 상호작용 ───────────────────────── */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'stop') return;
  if (act === 'abo')  S.abo = t.dataset.val;
  else if (act === 'rh')   S.rh = t.dataset.val;
  else if (act === 'comp'){ const v = t.dataset.val;
    S.comps = S.comps.indexOf(v) >= 0 ? S.comps.filter(x => x !== v) : S.comps.concat([v]); }
  else if (act === 'inc')  S.units = Math.min(20, S.units + 1);
  else if (act === 'dec')  S.units = Math.max(1, S.units - 1);
  else if (act === 'urg')  S.urgency = t.dataset.val;
  else if (act === 'search') S.searched = true;
  else if (act === 'ins')  S.openInsight = S.openInsight === t.dataset.id ? null : t.dataset.id;
  else if (act === 'sort') S.sort = t.dataset.val;
  else if (act === 'req'){ const id = t.dataset.id; if (S.requested.indexOf(id) < 0) S.requested = S.requested.concat([id]); }
  else if (act === 'modal') S.modalId = t.dataset.id;
  else if (act === 'closeModal') S.modalId = null;
  else return;
  render();
});

document.addEventListener('change', function(e){
  const t = e.target.closest('[data-act="region"]');
  if (!t) return;
  S.region = t.value; render();
});

document.addEventListener('mouseover', function(e){
  const sc = e.target.closest('[data-act="score"]');
  if (sc && S.hoverId !== sc.dataset.id){ S.hoverId = sc.dataset.id; render(); return; }
  const so = e.target.closest('[data-act="sort"]');
  const wantTip = !!(so && so.dataset.val === '유효기간 임박순');
  if (wantTip !== S.sortTip){ S.sortTip = wantTip; render(); }
});

document.addEventListener('mouseout', function(e){
  const sc = e.target.closest('[data-act="score"]');
  if (sc && !(e.relatedTarget && sc.contains(e.relatedTarget))){ S.hoverId = null; render(); }
});

render();
</script>
</body>
</html>
